<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Student Task & Assignment Planner</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 950px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h1 { margin-top: 0; color: #1e293b; text-align: center; }
    .subtitle { text-align: center; color: #64748b; margin-top: -10px; margin-bottom: 25px; }
    .dashboard { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 25px; }
    .stat-card { padding: 15px; border-radius: 8px; text-align: center; background: #f8fafc; border: 1px solid #e2e8f0; }
    .stat-card h3 { margin: 0; font-size: 26px; color: #0f172a; }
    .stat-card p { margin: 5px 0 0; font-size: 13px; color: #475569; font-weight: 600; }
    .stat-overdue { background: #fef2f2; border-color: #fecaca; }
    .stat-overdue h3, .stat-overdue p { color: #dc2626; }
    .stat-done { background: #f0fdf4; border-color: #bbf7d0; }
    .stat-done h3, .stat-done p { color: #16a34a; }
    .form-box { background: #f8fafc; padding: 18px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 25px; }
    .form-row { display: grid; grid-template-columns: 2fr 1.5fr 1.2fr 1fr auto; gap: 10px; align-items: end; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; color: #475569; }
    .form-group input, .form-group select { width: 100%; padding: 9px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
    .btn-add { background: #2563eb; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; font-weight: 600; cursor: pointer; height: 37px; }
    .btn-add:hover { background: #1d4ed8; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
    th { background: #f1f5f9; color: #334155; font-weight: 600; }
    tr.overdue-row { background-color: #fff1f2; }
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; display: inline-block; }
    .prio-High { background: #fee2e2; color: #b91c1c; }
    .prio-Medium { background: #fef3c7; color: #b45309; }
    .prio-Low { background: #e0f2fe; color: #0369a1; }
    .overdue-tag { background: #dc2626; color: white; padding: 2px 6px; border-radius: 4px; font-size: 11px; margin-left: 6px; font-weight: bold; }
    .status-select { padding: 6px; border-radius: 5px; border: 1px solid #cbd5e1; font-weight: 600; font-size: 13px; }
    .btn-delete { background: #ef4444; color: white; border: none; padding: 6px 10px; border-radius: 5px; cursor: pointer; font-size: 12px; }
  </style>
</head>
<body>

<div class="container">
  <h1>Smart Student Task & Assignment Planner</h1>
  <p class="subtitle">Agile Sprint 1 MVP — Track Deadlines, Priorities & Completion Progress</p>

  <div class="dashboard">
    <div class="stat-card"><h3 id="totalCount">0</h3><p>Total Tasks</p></div>
    <div class="stat-card"><h3 id="pendingCount">0</h3><p>Pending</p></div>
    <div class="stat-card"><h3 id="progressCount">0</h3><p>In Progress</p></div>
    <div class="stat-card stat-done"><h3 id="completedCount">0</h3><p>Completed</p></div>
    <div class="stat-card stat-overdue"><h3 id="overdueCount">0</h3><p>Overdue!</p></div>
  </div>

  <div class="form-box">
    <div class="form-row">
      <div class="form-group">
        <label>Assignment Title</label>
        <input type="text" id="taskTitle" placeholder="e.g., DBMS ER Diagram Lab">
      </div>
      <div class="form-group">
        <label>Subject</label>
        <input type="text" id="taskSubject" placeholder="e.g., Database Systems">
      </div>
      <div class="form-group">
        <label>Due Date</label>
        <input type="date" id="taskDueDate">
      </div>
      <div class="form-group">
        <label>Priority</label>
        <select id="taskPriority">
          <option value="High">High</option>
          <option value="Medium" selected>Medium</option>
          <option value="Low">Low</option>
        </select>
      </div>
      <button class="btn-add" onclick="addTask()">+ Add Task</button>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Assignment Title</th>
        <th>Subject</th>
        <th>Due Date</th>
        <th>Priority</th>
        <th>Status (Update)</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="taskTableBody"></tbody>
  </table>
</div>

<script>
  let tasks = [
    { id: 1, title: "Agile Board & Backlog Setup", subject: "Software Engineering", dueDate: "2026-10-20", priority: "High", status: "Completed" },
    { id: 2, title: "Submit IEEE Literature Survey", subject: "Research Methodology", dueDate: "2026-10-24", priority: "High", status: "Pending" },
    { id: 3, title: "Frontend UI & Progress Dashboard", subject: "Web Technologies", dueDate: "2026-10-28", priority: "High", status: "In Progress" },
    { id: 4, title: "Unit Testing & Sprint Review PPT", subject: "Software Engineering", dueDate: "2026-10-30", priority: "Medium", status: "Pending" }
  ];

  function isOverdue(dueDate, status) {
    if (status === "Completed") return false;
    const today = new Date().toISOString().split("T")[0];
    return dueDate < today;
  }

  function renderTasks() {
    const tbody = document.getElementById("taskTableBody");
    tbody.innerHTML = "";
    let pending = 0, inProgress = 0, completed = 0, overdue = 0;

    tasks.forEach(task => {
      const overdueFlag = isOverdue(task.dueDate, task.status);
      if (task.status === "Pending") pending++;
      if (task.status === "In Progress") inProgress++;
      if (task.status === "Completed") completed++;
      if (overdueFlag) overdue++;

      const tr = document.createElement("tr");
      if (overdueFlag) tr.className = "overdue-row";
      tr.innerHTML = `
        <td><strong>${task.title}</strong> ${overdueFlag ? '<span class="overdue-tag">OVERDUE</span>' : ''}</td>
        <td>${task.subject}</td>
        <td>${task.dueDate}</td>
        <td><span class="badge prio-${task.priority}">${task.priority}</span></td>
        <td>
          <select class="status-select" onchange="updateStatus(${task.id}, this.value)">
            <option value="Pending" ${task.status === 'Pending' ? 'selected' : ''}>Pending</option>
            <option value="In Progress" ${task.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
            <option value="Completed" ${task.status === 'Completed' ? 'selected' : ''}>Completed</option>
          </select>
        </td>
        <td><button class="btn-delete" onclick="deleteTask(${task.id})">Delete</button></td>
      `;
      tbody.appendChild(tr);
    });

    document.getElementById("totalCount").innerText = tasks.length;
    document.getElementById("pendingCount").innerText = pending;
    document.getElementById("progressCount").innerText = inProgress;
    document.getElementById("completedCount").innerText = completed;
    document.getElementById("overdueCount").innerText = overdue;
  }

  function addTask() {
    const title = document.getElementById("taskTitle").value.trim();
    const subject = document.getElementById("taskSubject").value.trim();
    const dueDate = document.getElementById("taskDueDate").value;
    const priority = document.getElementById("taskPriority").value;
    if (!title || !subject || !dueDate) {
      alert("Please fill in Assignment Title, Subject, and Due Date.");
      return;
    }
    tasks.push({ id: Date.now(), title, subject, dueDate, priority, status: "Pending" });
    document.getElementById("taskTitle").value = "";
    document.getElementById("taskSubject").value = "";
    renderTasks();
  }

  function updateStatus(id, newStatus) {
    const task = tasks.find(t => t.id === id);
    if (task) { task.status = newStatus; renderTasks(); }
  }

  function deleteTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    renderTasks();
  }

  renderTasks();
</script>

</body>
</html>
